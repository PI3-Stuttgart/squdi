# Offline desktop setup. This configuration never connects to a QM controller.
global:
    startup_modules: [tinOps]
    namespace_server_port: 18863
hardware:
    tinOps_timetagger:
        module.Class: 'timetagger.nuclear_counter.NuclearTimeTaggerCounter'
        options:
            dummy_mode: true
    tinOps_qm:
        module.Class: 'OPX.quantum_machine_hardware.QuantumMachineHardware'
        options:
            dummy_mode: true
            dummy_seed: 42
            dummy_delay_s: 0.4
logic:
    tinOps_thresholds:
        module.Class: 'nuclear_ops.readout_calibration_logic.ReadoutCalibrationLogic'
        options:
            default_profile: default
    tinOps_runner:
        module.Class: 'nuclear_ops.nuclear_operations_logic.NuclearOperationsLogic'
        connect:
            quantum_machine: tinOps_qm
            external_counter: tinOps_timetagger
            threshold_provider: tinOps_thresholds
        options:
            setup_file: 'C:/Git/squdi/work/gui-smoke-b3f8170b/setup.h5'
            output_directory: 'C:/Git/squdi/work/gui-smoke-b3f8170b/runs'
            recipe_modules: ['qudi.logic.nuclear_ops.snv_qua_recipes', 'qudi.logic.nuclear_ops.extended_recipes']
    tinOps_queue:
        module.Class: 'nuclear_ops.experiment_queue_logic.ExperimentQueueLogic'
        connect:
            runner: tinOps_runner
        options:
            queue_file: 'C:/Git/squdi/work/gui-smoke-b3f8170b/queue.h5'
            auto_start: false
            continue_on_failure: true
gui:
    tinOps:
        module.Class: 'nuclear_ops.nuclear_ops_gui.NuclearOpsGui'
        connect:
            queue: tinOps_queue
            runner: tinOps_runner
            calibration: tinOps_thresholds

