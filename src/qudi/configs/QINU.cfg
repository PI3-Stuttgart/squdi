#  Example Qudi configuration file.

global:
    # list of modules to load when starting
    startup: []

    # Module server configuration for accessing qudi GUI/logic/hardware modules from remote clients
   # remote_modules_server:
   #     address: '129.69.46.82'
   #     port: 12345

    # Server port for serving the active qudi module namespace locally (localhost).
    # Used by e.g. the Qudi jupyter kernel.
    namespace_server_port: 18861

    # If this flag is set (True), all arguments passed to qudi module APIs from remote
    # (jupyter notebook, qudi console, remote modules) will be wrapped and passed "per value"
    # (serialized and de-serialized). This is avoiding f lot of inconveniences with using numpy in
    # remote clients.
    # If you do not want to use this workaround and know what you are doing, you can disable this
    # feature by setting this flag to False.
    force_remote_calls_by_value: True

    # Qss stylesheet for controlling the appearance of the GUIs.
    # Absolute path or relative to qudi.artwork.styles
    stylesheet: 'qdark.qss'

    # Default root directory for measurement data storage. All eventual data sub-directories should
    # be contained within this directory. This is not enforced, just convention.
    # The fallback directory is <user home>/qudi/Data/
    # default_data_dir: C:\Users\neverhorst\qudi\Data

    # Save data to daily data sub-directories by default
    daily_data_dirs: True

gui:
    wavemeter_gui:
        module.Class: 'wavemeter.wavemeterloggui.WavemeterLogGui'
        connect:
            wavemeterloggerlogic: 'wavelogger_logic'

    ple_gui:
        module.Class: 'ple.ple_gui.PLEScanGui'
        connect:
            scannerlogic: laser_scanner_logic
            optimizerlogic: ple_optimize_logic
            data_logic: ple_data_logic

    timetagger:
        module.Class: 'timetagger.timetagger.TTGui'
        connect:
            timetaggerlogic: 'timetaggerlogic'

    magnetgui_qinu:
        module.Class: 'magnet.magnet_gui_qinu.MagnetWindow'
        connect:
            magnetlogic: magnetlogic
            magnet: vector_magnet

    setup_control:
        module.Class: setup_control_old.setupcontrolgui.SetupControlGUI
        connect:
            setupcontrollogic: setupcontrollogic
        options: {}

    scanner_gui:
        module.Class: 'scanning.scannergui.ScannerGui'
        options:
            image_axes_padding: 0.02
            default_position_unit_prefix: null  # optional, use unit prefix characters, e.g. 'u' or 'n'
            optimizer_plot_dimensions: [2,1]
        connect:
            scanning_logic: scanning_probe_logic
            data_logic: scanning_data_logic
            optimize_logic: scanning_optimize_logic

    odmr_gui:
        module.Class: 'odmr.odmrgui.OdmrGui'
        connect:
            odmr_logic: 'odmr_logic'

    poi_manager_gui:
        module.Class: 'poimanager.poimanagergui.PoiManagerGui'
        connect:
            poi_manager_logic: 'poi_manager_logic'

    switch_gui:
        module.Class: 'switch.switch_gui.SwitchGui'
        connect:
            switchlogic: 'switchlogic'
    
    AO_gui:
        module.Class: 'AO.AO_gui.AOGui'
        connect:
            aologic: 'AOLogic'
    
    SetupControl_gui:
        module.Class: 'setup_control.setup_control.SetupControlGui'


logic:

    wavelogger_logic:
        module.Class: "wavemeter_logger_logic.WavemeterLoggerLogic"
        connect:
            wavemeter: "wavemeter"
            timetagger: 'tagger'

    spectrometerlogic:
        module.Class: 'spectrometer_logic.SpectrometerLogic'
        connect:
            spectrometer: 'oceanoptics'
            #flip_mirror: 'flip_mirror_switch_ni'

    laser_scanner_logic:
        module.Class: 'ple.ple_scanner_logic.PLEScannerLogic'
        options:
            scan_axis: 'a'
            max_history_length: 10
            max_scan_update_interval: 2
            position_update_interval: 1
            channel: 'sum'
        connect:
            scanner: tt_laser_scanner

    ple_data_logic:
        module.Class: 'ple.data_logic.PleDataLogic'
        options:
            max_history_length: 10
        connect:
            scan_logic: laser_scanner_logic

    ple_optimize_logic:
        module.Class: 'ple.optimize_logic.PLEOptimizeScannerLogic'
        connect:
            scan_logic: laser_scanner_logic

    timetaggerlogic:
        module.Class: 'timetagger_logic.TimeTaggerLogic'
        connect:
            timetagger: 'tagger'

    magnetlogic:
        module.Class: 'magnetlogic.MagnetLogic'
        connect:
            magnet: vector_magnet
            tagger: tagger

    camera_logic:
        module.Class: 'camera_logic.CameraLogic'
        connect:
            camera: 'thorlabs_camera'

    scanning_probe_logic:
        module.Class: 'scanning.probe_logic.ScanningProbeLogic'
        options:
            max_history_length: 10
            max_scan_update_interval: 2
            position_update_interval: 1
            backwards_line_resolution: 100
        connect:
            scanner: adwin_scanner


    setupcontrollogic:
        module.Class: setup_control.setup_control.SetupControlLogicQINU
        connect:
            Adwin_IO: adwin_IO
        options: {}

    scanning_data_logic:
        module.Class: 'scanning.data_logic.ScanningDataLogic'
        options:
            max_history_length: 10
        connect:
            scan_logic: scanning_probe_logic

    scanning_optimize_logic:
        module.Class: 'scanning.optimize_logic.ScanningOptimizeLogic'
        connect:
            scan_logic: scanning_probe_logic
        options:
            backwards_line_resolution: 20

    odmr_logic:
        module.Class: 'odmr_logic.OdmrLogic'    
        connect:
            microwave: 'mw_source_smiq'
            data_scanner: 'adwin_tt_input'

    poi_manager_logic:
        module.Class: 'poi_manager_logic.PoiManagerLogic'
        options:
            data_scan_axes: xy
        connect:
            scanning_logic: 'scanning_probe_logic'
            optimize_logic: 'scanning_optimize_logic'
            data_logic: 'scanning_data_logic'

    switchlogic:
        module.Class: 'switch_logic.SwitchLogic'
        options:
            watchdog_interval: 1  # optional
            autostart_watchdog: True  # optional
        connect:
            switch: 'switch_combiner'
    AOLogic:
        module.Class: 'AO_logic.AOLogic'
        options:
            watchdog_interval: 1  # optional
            autostart_watchdog: True  # optional
        connect:
            ao_hardware: 'AO_OPX'

hardware:

    wavemeter_proxy:
        module.Class: 'wavemeter.high_finesse_proxy.HighFinesseProxy'
        options:
            watchdog_interval: 1.0  # how often the watchdog checks for errors/changes in s

    wavemeter:
        module.Class: 'wavemeter.high_finesse_wavemeter.HighFinesseWavemeter'
        connect:
            proxy: wavemeter_proxy
        options:
            channels:
                red_laser:
                    switch_ch: 1    # channel on the wavemeter switch
                    unit: 'm'    # wavelength (m) or frequency (Hz)
                    exposure: 10  # exposure time in ms, optional

    dl_pro:
        module.Class: 'laser.toptica_dl_pro.DlProLaser'    
        options:
            tcp_address: 192.168.1.13
            trigger_channel : 3
            ao_channel_config : 
                OutA: 
                    limits: [0, 4] 
                    keep_value: True

    tt_laser_scanner:
        module.Class: 'interfuse.dl_pro_tt_ao_scan.DLProTTPLEScanner'
        connect:
            tt: 'tagger'
            #tt_remote: 'tagger_remote'
            triggered_ao: 'dl_pro'
        options:
            channel_mapping:
                a: 'OutA'
                APD1: 'tt_1'
            sum_channels: ["tt_1"]
            ao_trigger_channel: "tt_8"
            # ao_remote_trigger_channel: "ttR_6"
            scan_units: 'MHz'
            position_ranges: # in m
                a: [0, 18000] #MHz
            frequency_ranges:
                a: [1, 2000] #Hz
            resolution_ranges:
                a: [20, 5000]  # pixels
            input_channel_units:
                APD1: 'c/s'
            backwards_line_resolution: 100 # optional
            maximum_move_velocity: 50e9 #MHz/s

    ppg:
        module.Class: 'picoquant.ppg512.PPG512'
        options:
            port: 'COM3'
            vccrf: 15000
            vref: 400

    powermeter:
        module.Class: 'powermeter.thorlabs_powermeter.ThorlabsPowermeter'
        options:
            # Device address of the powermeter.
            # If omitted, the module will connect to the first powermeter found on the system.
            # The module logs an info message with the addresses of all available powermeters upon activation.
            # address: 'USB0::0x1313::0x8078::P0012345::INSTR'
            wavelength: 520.0

    thorlabs_camera:
        module.Class: 'camera.thorlabs.thorlabs_DCx.CameraThorlabs'
        options:
            default_exposure: 0.1
            default_gain: 1.0
            id_camsera: 0 # if more tha one camera is present


    
    adwin_AO: #for confocal static.
        module.Class: 'jaeger_computer_technik.adwin_IO.Adwin_AO'
        options:
            device_name: 'adwin11'
            channels:
                ao1: #x#
                    limits: [-5.0, 5.0]
                    limits_LT: [-5.0, 5.0]
                    keep_value: True
                ao2: #y#
                    limits: [-5.0, 5.0]
                    limits_LT: [-5.0, 5.0]
                    keep_value: True
                ao3: #z#
                    limits: [0, 5.0]
                    #limits: [0, 10]
                    limits_LT: [0, 5.0]
                    keep_value: True
    
    vector_magnet:
        module.Class: 'jaeger_computer_technik.adwin_vector_magnet.Magnet3D'

        options:
            ramp_freq: 2 #Hz
            voltage_step_size: 0.01 # V
            timerIntervals:
                'fastRamp' : 1000
                'rampToZero' : 1000
    
    adwin_trigger:
        module.Class: 'jaeger_computer_technik.adwin_IO.AdwinTrigger'

    adwin_IO:
        module.Class: 'jaeger_computer_technik.adwin_IO.Adwin_IO'
        options:
            ports:
                digital:
                    0: 
                        name: 'green_laser'
                        IO: 'out'
        
                    1:
                        name: 'flip_powermeter'
                        IO: 'out'
                
                    2: 
                        name: 'flip_mirror_camera_path' 
                        IO: 'out'

                    4: 
                        name: 'blue_laser'
                        IO: 'out'

                    5: 
                        name: 'blue_laser_aom'
                        IO: 'out'

                    6: 
                        name: 'yellow_laser_aom'
                        IO: 'out'

                    7:
                        name: 'red_laser_aom'
                        IO: 'out'

                analog:
                    7:
                        name: 'green_laser_attenuation'

                    8:
                        name: 'lamp_power'

            
    fastcounter_timetagger:
        module.Class: 'swabian_instruments.timetagger_fast_counter.TimeTaggerFastCounter'
        options:
            timetagger_channel_apd_0: 1
            timetagger_channel_apd_1: 2
            timetagger_channel_detect: 5
            timetagger_channel_sequence: 5
            timetagger_sum_channels: True
        connect:
            timetagger: 'tagger'
    
    tagger:
        module.Class: 'swabian_instruments.timetagger_api.TT'
        options:
            port: 12233
            hist:
                channels: [1, 2, 3]
                trigger_channel: 5

            corr:
                channel_start: 2
                channel_stop: 3
            counter:
                channels: [1]

            combiner:
                channels: [1,2]
            channels_params:
                1:
                    delay: 0
                    trigger_level: 0.3
                2:
                    delay: -30e3
                    trigger_level: 0.3
                3:
                    delay: 0
                    trigger_level: 0.3
                6: # cwave internal scanner
                    delay: 20e3
                    trigger_level: 2
                7: # trigger Scanner
                    delay: 0
                    trigger_level: 1.5
                8: # cwave internal scanner
                    delay: 0
                    trigger_level: 1
    
    

    adwin_galvo:
        module.Class: 'jaeger_computer_technik.adwin_Scanner.Adwin_Scanning_Device'
        options:
            device_name: 'adwin11'
            channels:
                ao1:
                    unit: 'V'
                    limits: [-5.0, 5.0]
                    keep_value: True
                ao2:
                    unit: 'V'
                    limits: [-5.0, 5.0]
                    keep_value: True


                ao3:
                    unit: 'V'
                    limits: [0, 5.0]
                    keep_value: True
            clock:
                do9: 'scan_clock_physical_output'


    adwin_tt_io: ###C:\Users\yy3\git\squdi\src\qudi\hardware\jaeger_computer_technik\adwin_tt_io.py
        module.Class: 'jaeger_computer_technik.adwin_tt_io.AdwinSamplingIO'
        connect:
            tt: tagger
            adwin: adwin_galvo

        options:
            device_name: 'adwin11' ##for booting? - maybe not needed as it is lready in adwin_base.
            input_channel_units:  # optional
                tt_1: 'c/s'
            sum_channels: ["tt_1"]
            output_channel_units:
                'ao1': 'V'
                'ao2': 'V'
                'ao3': 'V'
            #adc_voltage_ranges:
                #ai0: [-10, 10]  # optional
                #ai1: [-10, 10]  # optional
            output_voltage_ranges:
                ao1: [-5, 5]
                ao2: [-5, 5]
                ao3: [0, 5]
            output_voltage_ranges_LT:
                ao1: [-5, 5]
                ao2: [-5, 5]
                ao3: [0, 5]
                #ao3: [0, 1]
    
            
            #TODO output range, also limits need to be included in constraints
            frame_size_limits: [1, 1e9]  # optional #TODO actual HW constraint?
            output_mode: 'JUMP_LIST' #'JUMP_LIST' # optional, must be name of SamplingOutputMode
            read_write_timeout: 10  # optional
            sample_clock_output: 'do9' # optional
            tt_adwin_clock_input: 'tt_7' #input of the clock for the NI card into the time tagger
            tt_falling_edge_clock_input: 'tt_7'
            #flip mirror porto 0 channel 4

    adwin_tt_input: ###C:\Users\yy3\git\squdi\src\qudi\hardware\jaeger_computer_technik\adwin_tt_io.py
        module.Class: 'jaeger_computer_technik.adwin_tt_input.AdwinSamplingInput'
        connect:
            tt: 'tagger'
            adwin_trigger: 'adwin_trigger'
        options:
            device_name: 'adwin11'
            digital_channel_units:  # optional
                'tt1': 'c/s'
                'tt2': 'c/s'
                'tt3': 'c/s'
            sum_channels: ["tt1", "tt2"]
            max_channel_samples_buffer: 10000000  # optional, default 10000000
            read_write_timeout: 10  # optional, default 10
            sample_clock_output: 'do3'  # optional
            counter_sample_clock_output: "do3"
            tt_ni_clock_input: 'tt6' #input of the clock for the ADwin card into the time tagger
            tt_falling_edge_clock_input: 'tt6'



    adwin_scanner:
        #module.Class: 'jaeger_computer_technik.adwin_base.AdwinBase'
        module.Class: 'interfuse.adwin_scanning_probe_interfuse.NiScanningProbeInterfuseBare'
        connect:
            scan_hardware: 'adwin_tt_io'
            analog_output: 'adwin_AO'
        
        options:
            ni_channel_mapping:
                x: 'ao1'
                y: 'ao2'
                z: 'ao3'
                APD1: 'tt_1'
            sum_channels: ["tt_1"]#, "tt_2"]
            scan_units: 'm'
            position_ranges: # in m
                z: [-5e-6, 15e-6]
                x: [-200e-6, 200e-6]
                y: [-200e-6, 200e-6]
            frequency_ranges:
                z: [1, 300]
                x: [1, 300]
                y: [1, 300]
            resolution_ranges:
                z: [1, 1000]
                x: [1, 1000]
                y: [1, 1000]
            input_channel_units:
                APD1: 'c/s'
            
            backwards_line_resolution: 0 # optional
            maximum_move_velocity: 400e-6 #400e-6 #m/s 
            default_samples_number: 50
            max_counts: 3e7
            read_write_timeout: 10
            counting_edge_rising: True
            scanner_counter_channels: ['1','2']
                
    mw_source_smiq:
        module.Class: 'microwave.mw_source_smiq.MicrowaveSmiq'
        options:
            visa_address: 'GPIB0::28::INSTR'
            comm_timeout: 10000  # in milliseconds

    digital_switch_opx:
        module.Class: 'OPX.digital_switch_OPX.DigitalSwitchOPX'
        options:
            remember_states: True
            qm_config_file: 'configuration'

    digital_switch_adwin:
        module.Class: 'jaeger_computer_technik.digital_switch_adwin.DigitalSwitchAdwin'
        options:
            switches:
                laser_550:
                    port: 0
                
                laser_450:
                    port: 4

                flip_mirror_camera:
                    port: 2
                    pulsed_output: True
                    states: ['out', 'in']

                flip_powermeter:
                    port: 1
                    pulsed_output: True
                    states: ['out', 'in']
    
    switch_combiner:
        module.Class: 'interfuse.switch_combiner_interfuse.SwitchCombinerInterfuse'
        connect:
            switch1: digital_switch_opx
            switch2: digital_switch_adwin
        options:
            name: 'DO'  # optional name of the combined hardware

            # if True the switch names will be extended by the hardware name of the individual switches in front.
            extend_hardware_name: False

    AO_OPX:
        module.Class: 'OPX.analog_output_OPX.AnalogOutputOPX'
        options:
            qm_config_file: "configuration"