    tagger:
        module.Class: 'swabian_instruments.timetagger_api.TT'
        options:
            remote_tagger_ip: '129.69.46.41'
            remote_tagger_port: 41101
            counter:
                channels: [1, 2]
            hist:
                channels: [1, 2]
                trigger_channel: 5

            corr:
                channel_start: 1
                channel_stop: 2
            channels_params:
                1:
                    delay: 0
                    trigger_level: 0.2
                2:
                    delay: 0
                    trigger_level: 0.2
                7:
                    delay: 0
                    trigger_level: 0.4

    
           
    # tagger:

    #     module.Class: 'swabian_instruments.timetagger_api.TT'
