    ni_scanner:
        module.Class: 'interfuse.ni_scanning_probe_interfuse.NiScanningProbeInterfuse'
        connect:
            scan_hardware: 'ni_tt_io'
            analog_output: 'ni_ao'
        options:
            ni_channel_mapping:
                z: 'ao2'
                x: 'ao0'
                y: 'ao1'
                #APD1: 'PFI8'
                APD1: 'tt_1'
    
                #AI0: 'ai0'
                #APD3: 'PFI10'
            scan_units: 'm'
            position_ranges: # in m
                z: [0e-6, 75e-6]
                x: [0e-6, 75e-6]
                y: [0e-6, 75e-6]
            frequency_ranges:
                z: [1, 300]
                x: [1, 300]
                y: [1, 300]
            resolution_ranges:
                z: [1, 1000]
                x: [1, 1000]
                y: [1, 1000]
            input_channel_units:
                APD1: 'c/s'

                #AI0: 'V's
                #APD2: 'c/s'
                #APD3: 'c/s'
            backwards_line_resolution: 200 # optional
            maximum_move_velocity: 400e-6 #400e-6 #m/s 

    ni_tt_io:
        module.Class: 'ni_x_series.ni_tt_io.NI_TT_XSeriesFiniteSamplingIO'
        connect:
            tt: tagger
        options:
            device_name: 'Dev3'
            input_channel_units:  # optional
                tt_1: 'c/s'

                #ai0: 'V'
                #ai1: 'V'
            output_channel_units:
                'ao0': 'V'
                'ao1': 'V'
                'ao2': 'V'
            #adc_voltage_ranges:
                #ai0: [-10, 10]  # optional
                #ai1: [-10, 10]  # optional
            output_voltage_ranges:
                ao0: [0, 10]
                ao1: [0, 10]
                ao2: [0, 10]
    
            #TODO output range, also limits need to be included in constraints
            frame_size_limits: [1, 1e9]  # optional #TODO actual HW constraint?
            output_mode: 'JUMP_LIST' #'JUMP_LIST' # optional, must be name of SamplingOutputMode
            read_write_timeout: 10  # optional
            sample_clock_output: '/Dev3/PFI8' # optional
            tt_remote_ni_clock_input: 'tt_7' #input of the clock for the NI card into the time tagger
            tt_remote_falling_edge_clock_input: 'tt_7'
            #flip mirror porto 0 channel 4

    ni_tt_finite_sampling_input:
        module.Class: 'ni_x_series.ni_x_tt_series_finite_sampling_input.NIXTTSeriesFiniteSamplingInput'
        connect:
            tagger: 'tagger'
        options:
            device_name: 'Dev3'
            digital_channel_units:  # optional
                'tt1': 'cnts'
            max_channel_samples_buffer: 10000000  # optional, default 10000000
            read_write_timeout: 10  # optional, default 10
            sample_clock_output: '/Dev3/PFI12'  # optional
            counter_sample_clock_output: '/Dev3/PFI3'
            tt_ni_clock_input: 'tt7' #input of the clock for the NI card into the time tagger
            tt_falling_edge_clock_input: 'tt7'

