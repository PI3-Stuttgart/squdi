    ni_ao:
        module.Class: 'ni_x_series.ni_x_series_analog_output.NIXSeriesAnalogOutput'
        options:
            device_name: 'Dev3'

            channels:
                ao0:
                    unit: 'V'
                    limits: [0, 10]
                    limits_LT: [0, 10]
                    keep_value: True
                ao1:
                    unit: 'V'
                    limits: [0, 10]
                    limits_LT: [0, 10]
                    keep_value: True
                ao2:
                    unit: 'V'
                    limits: [0, 10]
                    limits_LT: [0, 10]
                    keep_value: True
    flip_mirror_switch_ni:
        module.Class: 'switches.digital_switch_ni.DigitalSwitchNI'
        options:
            channel: '/Dev3/port0/line9'  # optional
            name: 'Flip mirror'  # optional
            switch_time: 0.1
            remember_states: False
            pulsed : True
            switches:                       # optional
