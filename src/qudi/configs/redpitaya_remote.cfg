global:
    # Automatically load the GUI on startup
    startup_modules: [redpitaya_gui]

gui:
    redpitaya_gui:
        module.Class: 'redpitaya.redpitaya_gui.RedPitayaPyrplGui'
        connect:
            redpitaya_logic: 'redpitaya_logic'

logic:
    redpitaya_logic:
        # Configuration for remote module connection
        native_module_name: 'redpitaya_logic'
        address: '129.69.46.178'
        port: 12345
        
        # SSL certificates for client authentication
        certfile: 'C:\Users\YY3\cert.pem'    # Path to client certificate on this PC
        keyfile: 'C:\Users\YY3\key.pem'      # Path to client private key on this PC
        cacerts: null                        # Skip server cert verification to bypass expiration (Nov 2024)
