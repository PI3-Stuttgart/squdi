# Additive example for the Quantum-Machines-native NuclearOps path.
# Keep the legacy OPX/queue modules configured until migrated recipes have
# passed simulation and hardware parity checks. Do not activate both OPX
# hardware modules against the same controller at the same time.

global:
    startup: []

hardware:
    quantum_machine_native:
        module.Class: 'OPX.quantum_machine_hardware.QuantumMachineHardware'
        options:
            configuration_module: 'qudi.hardware.OPX.configuration'
            close_on_deactivate: true

logic:
    nuclear_readout_calibration:
        module.Class: 'nuclear_ops.readout_calibration_logic.ReadoutCalibrationLogic'
        options:
            default_profile: 'default'

    nuclear_operations:
        module.Class: 'nuclear_ops.nuclear_operations_logic.NuclearOperationsLogic'
        connect:
            quantum_machine: 'quantum_machine_native'
            threshold_provider: 'nuclear_readout_calibration'
            # Add the optional setup services used by your recipes:
            # magnet: 'magnetlogic'
            # microwave: 'mw_source_smiq'
            # external_counter: 'gatedcounterlogic'
            # confocal: 'scanning_probe_logic'
            # confocal_optimizer: 'scanning_optimize_logic'
            # ple_optimizer: 'ple_optimize_logic'
            # wavemeter: 'wavemeter'
            # laser_controller: 'dlc_pro_620'
            # transition_tracker: 'transitiontrackerlogic'
            # analog_output: 'AOLogic'
            # switches: 'switch_combiner'
            # ppg: 'ppg'
        options:
            output_directory: 'C:/Data/nuclear_ops'
            recipe_modules: ['qudi.logic.nuclear_ops.snv_qua_recipes']

    nuclear_experiment_queue:
        module.Class: 'nuclear_ops.experiment_queue_logic.ExperimentQueueLogic'
        connect:
            runner: 'nuclear_operations'
        options:
            queue_file: 'C:/Data/nuclear_ops/queue.h5'
            auto_start: true
            continue_on_failure: true
            requeue_interrupted: false
