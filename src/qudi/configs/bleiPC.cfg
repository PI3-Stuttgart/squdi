#  Example Qudi configuration file.

global:
    # list of modules to load when starting
    # startup_modules: [powercontroller_logic, switch_gui, ello_devices, high_finesse_wavemeter_server, motordriver_pi3]

    # Module server configuration for accessing qudi GUI/logic/hardware modules from remote clients
    remote_modules_server:
        address: '129.69.46.178'
        port: 12345
        certfile: 'C:\Users\yy3\keys\server.crt'
        keyfile: 'C:\Users\yy3\keys\server.key'
        
    # Server port for serving the active qudi module namespace locally (localhost).
    # Used by e.g. the Qudi jupyter kernel.
    namespace_server_port: 18861  


    # If this flag is set (True), all arguments passed to qudi module APIs from remote
    # (jupyter notebook, qudi console, remote modules) will be wrapped and passed "per value"
    # (serialized and de-serialized). This is avoiding a lot of inconveniences with using numpy in
    # remote clients.
    # If you do not want to use this workaround and know what you are doing, you can disable this
    # feature by setting this flag to False.
    force_remote_calls_by_value: True

    # Qss stylesheet for controlling the appearance of the GUIs.
    # Absolute path or relative to qudi.artwork.styles
    stylesheet: 'qdark.qss'

    # Default root directory for measurement data storage. All eventual data sub-directories should
    # be contained within this directory. This is not enforced, just convention.
    # The fallback directory is <user home>/qudi/Data/
    # default_data_dir: C:\Users\neverhorst\qudi\Data
    default_data_dir: C:\Users\yy3\qudi_data
    # Save data to daily data sub-directories by default
    daily_data_dirs: True

gui:
    
    timetagger:
        module.Class: 'timetagger.timetagger.TTGui'
        connect:
            timetaggerlogic: 'timetaggerlogic'


    time_series_gui:
        module.Class: 'time_series.time_series_gui.TimeSeriesGui'
        options:
            use_antialias: True  # optional, set to False if you encounter performance issues
        connect:
            _time_series_logic_con: time_series_reader_logic

    cavity_gui:
        module.Class: 'ple.ple_gui.PLEScanGui'
        connect:
            scannerlogic: cavity_scanner_logic
            optimizerlogic: cavity_optimize_logic
            data_logic: cavity_data_logic
            # microwave: odmr_logic
            #repump: ple_repump_interfuse_logic


    switch_gui:
        module.Class: 'switch.switch_gui.SwitchGui'
        connect:
            switchlogic: 'switchlogic'

    pulsed_gui:
        module.Class: 'pulsed.pulsed_maingui.PulsedMeasurementGui'
        connect:
            pulsedmasterlogic: 'pulsed_master_logic'
    cwave_gui:
        module.Class: 'cwave.cwave_gui.CwaveGui'
        connect:
            cwavelogic: 'cwavelogic'
    servo_gui:
        module.Class: 'servo.servo_gui.ServoGui'
        connect:
            servo_logic: 'servo_logic'
    redpitaya_gui:
        module.Class: 'redpitaya.redpitaya_gui.RedPitayaPyrplGui'
        connect:
            redpitaya_logic: 'redpitaya_logic'


logic:
    laser_scanner_logic:
        module.Class: 'ple.ple_scanner_logic.PLEScannerLogic'
        options:
            scan_axis: 'a'
            max_history_length: 10
            max_scan_update_interval: 2
            position_update_interval: 1
        connect:
            scanner: ni_laser_scanner
    ple_optimize_logic:
        module.Class: 'ple.optimize_logic.PLEOptimizeScannerLogic'
        connect:
            scan_logic: laser_scanner_logic
    
    ple_data_logic:
        module.Class: 'ple.data_logic.PleDataLogic'
        options:
            max_history_length: 10
        connect:
            scan_logic: laser_scanner_logic

    cavity_scanner_logic:
        module.Class: 'ple.ple_scanner_logic.PLEScannerLogic'
        options:
            scan_axis: 'a'
            max_history_length: 10
            max_scan_update_interval: 2
            position_update_interval: 1
        connect:
            scanner: ni_cavity_scanner


    cavity_optimize_logic:
        module.Class: 'ple.optimize_logic.PLEOptimizeScannerLogic'
        connect:
            scan_logic: cavity_scanner_logic
    
    cavity_data_logic:
        module.Class: 'ple.data_logic.PleDataLogic'
        options:
            max_history_length: 10
        connect:
            scan_logic: cavity_scanner_logic
    
    #ple_repump_interfuse_logic:
    #    module.Class: 'ple.repump_interfuse.RepumpInterfuseLogic'
    #    options:
    #        resonant_laser:  'd_ch1'
    #        repump_laser: 'd_ch2'
    #    connect:
    #        pulsed: pulsed_master_logic
    camlogic:
        module.Class: 'camera_logic.CameraLogic'
        connect:
            camera: 'princeton_picam'
        options:
            exposure_time: 100 # exposure time in ms

    time_series_reader_logic:
        module.Class: 'time_series_reader_logic.TimeSeriesReaderLogic'
        options:
            max_frame_rate: 10  # optional (10Hz by default)
            calc_digital_freq: True  # optional (True by default)
            active_channels: ['ai8']
        connect:
            streamer: ni_instreamer

    pulsed_master_logic:
        module.Class: 'pulsed.pulsed_master_logic.PulsedMasterLogic'
        connect:
            pulsedmeasurementlogic: 'pulsed_measurement_logic'
            sequencegeneratorlogic: 'sequence_generator_logic'

    sequence_generator_logic:
        module.Class: 'pulsed.sequence_generator_logic.SequenceGeneratorLogic'
        #overhead_bytes: 0
        #additional_predefined_methods_path: null
        #additional_sampling_functions_path: null
        #assets_storage_path:
        connect:
            pulsegenerator: "pulsestreamer"

    pulsed_measurement_logic:
        module.Class: 'pulsed.pulsed_measurement_logic.PulsedMeasurementLogic'
        options:
            raw_data_save_type: 'text'
            #additional_extraction_path:
            #additional_analysis_path:
        connect:
            fastcounter: "fastcounter_timetagger"
            #microwave: 'microwave_dummy'
            pulsegenerator: "pulsestreamer"

    switchlogic:
        module.Class: 'switch_logic.SwitchLogic'
        connect:
            switch: ello_switch
            #switch_combiner_interfuse
        #options:
        #   watchdog_interval: 1  # optional
        #   autostart_watchdog: True  # optional
    wavelogger_logic:
        module.Class: "wavemeter_logger_logic.WavemeterLoggerLogic"
        connect:
            wavemeter: "high_finesse_wavemeter_server"
            # timetagger: 'tagger'

    cwavelogic:
        module.Class: "cwave_logic.CwaveLogic"
        connect:
            cwavelaser: "cwave"
            
    # power_controller_remote:
    #     native_module_name: 'powercontroller_logic'
    #     address: '129.69.46.82'
    #     port: 12346
    powercontroller_logic:
        module.Class: "power_controller.PowerControllerLogic"
        connect:
            #powermeter: "powermeter"
            motor_pi3: "motordriver_pi3"
            # counter: "counter"
        # allow_remote: true

    laser_controller:
        module.Class: "laser_controller.LaserControllerLogic"
        connect:
            motor_pulser: "switch_ni"
            ao_laser_control: "ni_ao_laser_control"
        allow_remote: true

    timetaggerlogic:
        module.Class: 'timetagger_logic.TimeTaggerLogic'
        connect:
            timetagger: 'tagger'
    servo_logic:
        module.Class: 'servo.servo_logic.ServoLogic'
        connect:
            servo_interface: 'servo_control'
    
    redpitaya_logic:
        module.Class: 'redpitaya_pyrpl_logic.RedPitayaPyrplLogic'
        connect:
            redpitaya_hardware: 'redpitaya'
        allow_remote: true

    
hardware:
    ppg512:
        module.Class: 'picoquant.ppg512.PPG512'
        options:
            port: 'COM3'
            vccrf : 12000
            vref : 400
    redpitaya: 
        module.Class: 'redpitaya.redpitaya_pyrpl.RedPitayaPyrpl'
        options: 
            config_file: 'C:/Users/yy3/GIT/pyrpl/pyrpl_config_lock_eom.yml'
        allow_remote: true
    tagger:
        module.Class: 'swabian_instruments.timetagger_api.TT'
        options:
            remote_tagger_ip: '129.69.46.178'
            remote_tagger_port: 41101
            hist:
                channels: [1,2]
                trigger_channel: 5

            corr:
                channel_start: 1
                channel_stop: 2
            counter:
                channels: [1,2]

            combiner:
                channels: [1,2]
            channels_params:
                1:
                    delay: 0
                    trigger_level: 0.12
                2:
                    delay: 0
                    trigger_level: 0.12
                3:
                    delay: 0
                    trigger_level: 0.12
                6: # cwave internal scanner
                    delay: 0
                    trigger_level: 0.1
                8: # cwave internal scanner
                    delay: 0
                    trigger_level: 1


    ni_cavity_scanner:
        module.Class: 'interfuse.ni_scanning_probe_interfuse.NiScanningProbeInterfuse'
        connect:
            scan_hardware: 'ni_tt_io_cavity_scanner'
            analog_output: 'ni_ao_cavity_control'
        options:
            ni_channel_mapping:
                a: 'ao0'
                APD1: 'tt_1'
                APD2: 'tt_2'
            scan_units: 'MHz'
            position_ranges: # in m
                a: [0, 29999]
            frequency_ranges:
                a: [1, 500]
            resolution_ranges:
                a: [20, 2000]
            input_channel_units:
                #APD111: 'c/s'
                #AI0: 'V/s'
                APD1: 'c/s'
                APD2: 'c/s'
            backwards_line_resolution: 100 # optional
            maximum_move_velocity: 5e3 #400e-6 #m/s
            
    ni_tt_io_cavity_scanner:
        module.Class: 'ni_x_series.ni_tt_io.NI_TT_XSeriesFiniteSamplingIO'
        connect:
            tt: tagger
        options:
            device_name: 'Dev1'
            input_channel_units:  # optional
                tt_1: 'c/s'
                tt_2: 'c/s'
                #ai0: 'V'
                #ai1: 'V'
            sum_channels: ["tt_1", "tt_2"]
            output_channel_units:
                'ao0': 'V'
            #adc_voltage_ranges:
                #ai0: [-10, 10]  # optional
                #ai1: [-10, 10]  # optional
            output_voltage_ranges:
                ao0: [0, 4]

            output_voltage_ranges_LT:
                ao0: [0, 4]

    
            
            #TODO output range, also limits need to be included in constraints
            frame_size_limits: [1, 1e9]  # optional #TODO actual HW constraint?
            output_mode: 'JUMP_LIST' #'JUMP_LIST' # optional, must be name of SamplingOutputMode
            read_write_timeout: 10  # optional
            sample_clock_output: '/Dev1/PFI8' # optional
            tt_ni_clock_input: 'tt_8' #input of the clock for the NI card into the time tagger
            tt_falling_edge_clock_input: 'tt_8'
            #flip mirror porto 0 channel 4


    ni_finite_sampling_io_cavity:
        module.Class: 'ni_x_series.ni_x_series_finite_sampling_io.NIXSeriesFiniteSamplingIO'
        options:
            device_name: 'Dev1'
            input_channel_units:
                ai0: 'V'
                pfi8: "c/s"
            output_channel_units: # Specify used output channels
                'ao0': 'V'
            adc_voltage_ranges:
                ai0: [-10, 10]  # optional
            
            output_voltage_ranges:
                ao0: [0, 4]
    
            frame_size_limits: [1, 1e9]  # optional #TODO actual HW constraint?
            default_output_mode: 'JUMP_LIST' # optional, must be name of SamplingOutputMode
            read_write_timeout: 10  # optional
            sample_clock_output: '/Dev1/PFI3' # optional: routing of sample clock to a physical connection
        allow_remote: true


    ni_ao_cavity_control:
        module.Class: 'ni_x_series.ni_x_series_analog_output.NIXSeriesAnalogOutput'
        options:
            device_name: 'Dev1'
            channels:
                ao0:
                    unit: 'V'
                    limits: [0, 4]
                    keep_value: True
        allow_remote: true

    ni_finite_sampling_io:
        module.Class: 'ni_x_series.ni_x_series_finite_sampling_io.NIXSeriesFiniteSamplingIO'
        options:
            device_name: 'Dev1'
            input_channel_units:
                ai0: 'V'
                pfi10: "c/s"
            output_channel_units: # Specify used output channels
                'ao1': 'V'
            adc_voltage_ranges:
                ai0: [-10, 10]  # optional
            
            output_voltage_ranges:
                ao1: [0, 4]
    
            frame_size_limits: [1, 1e9]  # optional #TODO actual HW constraint?
            default_output_mode: 'JUMP_LIST' # optional, must be name of SamplingOutputMode
            read_write_timeout: 10  # optional
            sample_clock_output: '/Dev1/PFI3' # optional: routing of sample clock to a physical connection
        allow_remote: true


    ni_ao_laser_remote:
        module.Class: 'ni_x_series.ni_x_series_analog_output.NIXSeriesAnalogOutput'
        options:
            device_name: 'Dev1'
            channels:
                ao1:
                    unit: 'V'
                    limits: [0,4]
                    keep_value: True
        allow_remote: true
    ni_ao_laser_control:
        module.Class: 'ni_x_series.ni_x_series_analog_output.NIXSeriesAnalogOutput'
        options:
            device_name: 'Dev1'
            channels:
                ao1:
                    unit: 'V'
                    limits: [0, 4]
                    keep_value: True
        allow_remote: true

    # optional, for slow counter / timer series reader
    ni_instreamer:
        module.Class: 'ni_x_series.ni_x_series_in_streamer.NIXSeriesInStreamer'
        options:
            device_name: 'Dev1'
            digital_sources:  # optional
                - 'pfi8'
                - 'pfi3'
            analog_sources:  # optional
                - 'ai0'
            #   - 'ai1'
            # external_sample_clock_source: 'PFI0'  # optional
            # external_sample_clock_frequency: 1000  # optional
            # adc_voltage_range: [-10, 10]  # optional
            max_channel_samples_buffer: 10000000  # optional
            read_write_timeout: 10  # optional
        
    ni_finite_sampling_input:
        module.Class: 'ni_x_series.ni_x_series_finite_sampling_input.NIXSeriesFiniteSamplingInput'
        options:
            device_name: 'Dev1'
            digital_channel_units:  # optional
                'pfi8': 'cnts'
                'pfi3': 'cnts'
            analog_channel_units:  # optional
                'ai0': 'V'

            max_channel_samples_buffer: 10000000  # optional, default 10000000
            read_write_timeout: 10  # optional, default 10
            sample_clock_output: '/Dev1/PFI14'  # optional

    dl_pro:
        module.Class: 'laser.toptica_dl_pro.DlProLaser'
        options:
            tcp_address: '169.254.128.41'
            current_range: [0, 90]
        
    high_finesse_wavemeter_server:
        module.Class: 'wavemeter.ws_wavemeter.HighFinesseWavemeter'
        options:
            measurement_timing: 0.3 # in secondsc
            active_channels: [4,2]
            selected_channels: [4]
            default_channel: 4

        allow_remote: true
    # high_finesse_client:
    #     module.Class: 'wavemeter.high_finesse_client.HighFinesseWavemeterClient'

    pulsestreamer:
        module.Class: 'swabian_instruments.pulse_streamer.PulseStreamer'
        options:
            pulsestreamer_ip: '129.69.46.189'
            #pulsed_file_dir: 'C:\\Software\\pulsed_files'
            laser_channel: 0
            uw_x_channel: 1
            use_external_clock: False
            external_clock_option: 0
    
    cwave:
        module.Class: 'cwave.cwave_api.CWave'
        options:
            ip: '129.69.46.217'
            port: '10001'
    
    motordriver_pi3:
        module.Class: 'motor.motordriver_pi3.Motordriver'
        options:
            port: 'COM6'
            active_motor_numbers: [0,1,2,3]
        allow_remote: true
    servo_control:
        module.Class: 'servo.servo_control.ServoSerialInterface'
        options:
            port: 'COM5'
            baudrate: 115200
            servo_limits:
                '1': null    # No limits for servo 1
                '2': null    # No limits for servo 2

    
